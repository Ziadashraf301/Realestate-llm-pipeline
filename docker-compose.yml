services:
  # PostgreSQL for Dagster
  postgres:
    container_name: dagster-postgres
    image: postgres:16
    env_file:
      - ./docker/env/.env.postgres
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Dagster Webserver & Daemon
  dagster:
    container_name: dagster
    build:
      context: ./docker
      dockerfile: Dockerfile
    volumes:
      - .:/opt/dagster/real_estate
      - ./volumes/dagster:/opt/dagster/dagster_home
      - ./configs:/opt/dagster/real_estate/configs
    env_file:
      - ./docker/env/.env.dagster
    depends_on:
      postgres:
        condition: service_healthy
      standalone:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - pipeline_net
    command: >
      sh -c "dagster-daemon run -w /opt/dagster/real_estate/src/real_estate/pipelines/workspace.yaml &
             dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/real_estate/src/real_estate/pipelines/workspace.yaml"

  # FastAPI Real Estate Intelligence System (uvicorn)
  api:
    container_name: real_estate_api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    volumes:
      - .:/app
    env_file:
      - ./docker/env/.env.api
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - standalone
      - clickhouse
      - mlflow

    networks:
      - pipeline_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # etcd for Milvus
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health --endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO for Milvus & DVC Storage (S3 Compatible on Port 9000)
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pipeline_net
    ports:
      - "9000:9000"
      - "9001:9001"

  # One-shot bucket initializer — creates dvc-storage & mlflow-artifacts on first boot
  minio-init:
    image: minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pipeline_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/dvc-storage &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        echo 'Buckets ready.'
      "
    restart: on-failure

  # Milvus Standalone Vector Database (HNSW & Scalar Filtering)
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      METRICS_ENABLED: "true"
      METRICS_PORT: 9091
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Attu Web Dashboard for Milvus
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "8000:3000"
    depends_on:
      standalone:
        condition: service_healthy
    networks:
      - pipeline_net
    restart: unless-stopped

  # Prometheus Monitoring Exporter
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pipeline_net
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "7000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - ./docker/env/.env.grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - pipeline_net
    restart: always

  # Self-Hosted MLflow Tracking & Model Registry (SQLite DB + MinIO S3 Artifacts)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.0
    container_name: real_estate_mlflow
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_HOST=0.0.0.0
      - MLFLOW_PORT=5000
      # SQLite for run metadata (lightweight, no extra DB needed)
      - BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      # MinIO as S3-compatible artifact store (shared with DVC & Milvus)
      - ARTIFACT_ROOT=s3://mlflow-artifacts
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - mlflow_data:/mlflow
    command: sh -c "pip install --no-cache-dir boto3 && mlflow db upgrade sqlite:////mlflow/mlflow.db && mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination s3://mlflow-artifacts --serve-artifacts --host 0.0.0.0 --port 5000"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pipeline_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis for Two-Tier Caching (6h TTL), Token-Bucket Rate Limiting & Persistent Auth
  redis:
    image: redis:7-alpine
    container_name: real_estate_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel notice
    networks:
      - pipeline_net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Native llama.cpp C++ Inference Server (Zero PyTorch, CPU AVX2 on Port 8080)
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: real_estate_llama_cpp
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf -c 4096 --host 0.0.0.0 --port 8080 -t 4
    networks:
      - pipeline_net
    restart: unless-stopped

  # ClickHouse Columnar Analytics Warehouse (Zero-Cost Local Mart replacing BigQuery)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: real_estate_clickhouse
    ports:
      - "8123:8123"      # HTTP Interface
      - "9002:9000"      # Native Interface
    environment:
      - CLICKHOUSE_DB=real_estate
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse123
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - pipeline_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://localhost:8123/ping' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx Reverse Proxy & Edge Security (Port 80)
  nginx:
    image: nginx:1.25-alpine
    container_name: real_estate_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pipeline_net
    restart: always

volumes:
  prometheus_data:
  grafana_data:
  mlflow_data:
  redis_data:
  clickhouse_data:

networks:
  pipeline_net:
    name: pipeline_net
    driver: bridge

