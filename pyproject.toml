[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-intelligence-system"
version = "1.0.0"
description = "Enterprise Real Estate Discovery, Agentic RAG, and Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ziad Ashraf", email = "ziad.ashraf@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "pymilvus>=2.5.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "mlflow==2.20.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.5.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "prometheus-client>=0.20.0",
    "markdown>=3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "dvc>=3.48.0",
    "dvc-s3>=3.1.0",
    "jupytext>=1.16.0",
    "nbstripout>=0.7.0"
]
research = [
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "optimum[onnxruntime]>=1.18.0",
    "ragas>=0.1.7",
    "datasets>=2.18.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
